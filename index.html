<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حلقة ابن عقيل</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="center-page">
  <main class="card login-card">
    <img src="logo.png" alt="شعار حلقة ابن عقيل" class="logo">
    <h1>حلقة ابن عقيل</h1>
    <p class="sub">نظام التحضير والتسميع</p>

    <button class="btn" id="loginBtn">تسجيل الدخول بحساب Google</button>
    <div class="status" id="status"></div>
    <button class="btn secondary hidden" id="logoutBtn">تسجيل الخروج</button>
  </main>

  <script type="module">
    import { auth, login, logout, getRole } from "./common.js?v=11";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const status = document.getElementById("status");

    function show(msg, isError = false) {
      status.innerHTML = msg;
      status.className = "status show" + (isError ? " error" : "");
    }

    loginBtn.onclick = async () => {
      try {
        await login();
      } catch (e) {
        if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
          show("ما تم تسجيل الدخول. رمز المشكلة: " + e.code, true);
        }
      }
    };
    logoutBtn.onclick = () => logout();

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        status.className = "status";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        return;
      }
      loginBtn.classList.add("hidden");
      show("جاري الدخول...");
      try {
        const r = await getRole(user);
        if (r.role === "admin") location.href = "admin.html";
        else if (r.role === "teacher") location.href = "teacher.html";
        else {
          show("حسابك غير مضاف في النظام.<br>أرسل هذا الإيميل للمشرف:<br><b dir='ltr'>" + r.email + "</b>", true);
          logoutBtn.classList.remove("hidden");
        }
      } catch (e) {
        show("مشكلة في الاتصال بقاعدة البيانات. رمز المشكلة: " + e.code, true);
        logoutBtn.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
