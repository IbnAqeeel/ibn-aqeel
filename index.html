<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حلقة ابن عقيل</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="شعار حلقة ابن عقيل" class="logo" id="logo">
    <h1>حلقة ابن عقيل</h1>
    <p class="sub">نظام التحضير والتسميع</p>

    <button class="btn" id="loginBtn">تسجيل الدخول بحساب Google</button>
    <button class="btn secondary hidden" id="logoutBtn">تسجيل الخروج</button>

    <div class="status" id="status"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const status = document.getElementById("status");

    function show(msg, isError = false) {
      status.textContent = msg;
      status.className = "status show" + (isError ? " error" : "");
    }

    loginBtn.onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (e) {
        show("ما تم تسجيل الدخول. رمز المشكلة: " + e.code, true);
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        show("✅ أهلاً " + (user.displayName || "") + " — الاتصال بـ Firebase شغّال");
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
      } else {
        status.className = "status";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
