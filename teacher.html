<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التسجيل - حلقة ابن عقيل</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="topbar">
    <img src="logo.png" alt="" class="topbar-logo">
    <div class="topbar-title">حلقة ابن عقيل<small id="halaqaName">التسجيل</small></div>
    <a class="link-btn hidden" id="adminLink" href="admin.html">لوحة المشرف</a>
    <button class="link-btn" id="logoutBtn">خروج</button>
  </header>

  <div class="daybar">
    <select id="halaqaSelect" class="hidden"></select>
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" aria-label="اليوم السابق">→</button>
      <label class="date-box">
        <span id="dateDay"></span>
        <small id="dateSub"></small>
        <input type="date" id="dateInput">
      </label>
      <button class="nav-btn" id="nextDay" aria-label="اليوم التالي">←</button>
    </div>
    <div class="day-warn hidden" id="dayWarn">هذا اليوم مو من أيام الحلقة</div>
    <div class="counts" id="counts"></div>
  </div>

  <main class="container">
    <p class="muted center" id="loading">جاري التحميل...</p>
    <button class="btn secondary hidden" id="allPresentBtn">✔ تحضير الباقين "حاضر"</button>
    <div class="list" id="studentsList"></div>
  </main>

  <script type="module" src="teacher.js?v=11"></script>
</body>
</html>
