<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التقارير - حلقة ابن عقيل</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="topbar no-print">
    <img src="logo.png" alt="" class="topbar-logo">
    <div class="topbar-title">حلقة ابن عقيل<small>التقارير والإحصائيات</small></div>
    <a class="link-btn" href="admin.html">لوحة المشرف</a>
  </header>

  <div class="container">
    <div class="card-box controls no-print">
      <select id="halaqaSel"></select>
      <div class="seg" id="periodSeg">
        <button type="button" data-p="week">أسبوع</button>
        <button type="button" data-p="month" class="on">شهر</button>
        <button type="button" data-p="custom">مخصص</button>
      </div>
      <div class="date-nav" id="periodNav">
        <button class="nav-btn" id="prevP">→</button>
        <div class="date-box static"><span id="pLabel"></span><small id="pSub"></small></div>
        <button class="nav-btn" id="nextP">←</button>
      </div>
      <div class="two hidden" id="customBox">
        <label class="mini-label">من<input type="date" id="fromIn"></label>
        <label class="mini-label">إلى<input type="date" id="toIn"></label>
      </div>
      <div class="row2">
        <button class="btn" id="pdfBtn">📄 PDF</button>
        <button class="btn secondary" id="xlsBtn">📊 Excel</button>
      </div>
    </div>

    <div class="print-head">
      <img src="logo.png" alt="">
      <div>
        <h2>حلقة ابن عقيل لتحفيظ القرآن الكريم</h2>
        <div id="printPeriod"></div>
      </div>
    </div>

    <div id="report"><p class="muted center">جاري التحميل...</p></div>
  </div>

  <div id="printArea"></div>

  <dialog id="stuModal">
    <div id="stuBody"></div>
    <div class="row no-print">
      <button class="btn" id="stuPrint">📄 تقرير الطالب PDF</button>
      <button class="btn gold" id="stuCard">🏅 بطاقة إنجاز</button>
    </div>
    <button class="btn secondary no-print" id="stuClose">إغلاق</button>
  </dialog>

  <dialog id="cardModal">
    <h3>بطاقة الإنجاز</h3>
    <img id="cardImg" class="card-preview" alt="بطاقة الإنجاز">
    <label class="mini-label">العبارة التشجيعية
      <input id="cardMsg" class="search" value="بارك الله فيك، وجعلك من أهل القرآن">
    </label>
    <div class="row">
      <button class="btn whatsapp" id="cardShare">مشاركة / واتساب</button>
      <a class="btn secondary" id="cardDownload" download="بطاقة-إنجاز.png">⬇️ تنزيل</a>
    </div>
    <button class="btn secondary" id="cardClose">إغلاق</button>
  </dialog>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="reports.js?v=11"></script>
</body>
</html>
