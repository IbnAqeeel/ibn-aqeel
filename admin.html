<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة المشرف - حلقة ابن عقيل</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <img src="logo.png" alt="" class="topbar-logo">
    <div class="topbar-title">حلقة ابن عقيل<small>لوحة المشرف</small></div>
    <button class="link-btn" id="logoutBtn">خروج</button>
  </header>

  <nav class="tabs">
    <button data-tab="students" class="active">الطلاب</button>
    <button data-tab="halaqat">الحلقات</button>
    <button data-tab="teachers">المعلمون</button>
    <button data-tab="settings">الأيام</button>
  </nav>

  <main class="container" id="app">
    <p class="muted center" id="loading">جاري التحميل...</p>

    <section id="tab-students" class="hidden">
      <div class="row2">
        <button class="btn" id="addStudentBtn">+ إضافة طالب</button>
        <button class="btn secondary" id="importBtn">📥 استيراد Excel</button>
      </div>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
      <div class="chips small" id="studentFilter"></div>
      <input id="studentSearch" class="search" placeholder="🔍 بحث بالاسم...">
      <div class="list-head">
        <span id="studentCount" class="muted"></span>
        <button class="small-btn" id="exportLinksBtn">📤 تصدير الروابط</button>
      </div>
      <div class="list" id="studentsList"></div>
    </section>

    <section id="tab-halaqat" class="hidden">
      <button class="btn" id="addHalaqaBtn">+ إضافة حلقة</button>
      <div class="list" id="halaqatList"></div>
    </section>

    <section id="tab-teachers" class="hidden">
      <button class="btn" id="addTeacherBtn">+ إضافة معلم</button>
      <p class="hint">المعلم يدخل بحساب Gmail حقه. أضف إيميله هنا، وبعدها يقدر يدخل الموقع ويشوف حلقته فقط.</p>
      <div class="list" id="teachersList"></div>
    </section>

    <section id="tab-settings" class="hidden">
      <div class="card-box">
        <h3>أيام انعقاد الحلقة</h3>
        <p class="hint">اضغط على اليوم لتفعيله أو إلغائه.</p>
        <div class="chips" id="daysBox"></div>
        <button class="btn" id="saveDaysBtn">حفظ الأيام</button>
      </div>
    </section>
  </main>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="row">
        <button class="btn" value="ok" id="modalOk">حفظ</button>
        <button class="btn secondary" value="cancel" id="modalCancel" formnovalidate>إلغاء</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
